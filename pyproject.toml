[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afdb-query"
version = "0.3.0"
description = "Sequence-based programmatic access to the AlphaFold Protein Structure Database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# ruff is pinned to a minor series: an unpinned range lets CI resolve a newer
# formatter than the one a change was verified against, and lint then fails on
# code nobody touched.
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.15,<0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/afdb_query"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# README.md is prose. Newer ruff formats Python inside Markdown fences, which
# reflows deliberately aligned example comments; documentation layout is not the
# formatter's call.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.pycodestyle]
# E501 fires only past 120 so a sentence of prose in a docstring is never forced to
# wrap mid-thought; `ruff format` still wraps code at line-length.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit the live AFDB and are excluded by default; coverage is
# measured over the unit suite alone, so the gate never depends on the network.
addopts = """-m 'not integration' \
--cov=afdb_query --cov-branch --cov-report=term-missing --cov-fail-under=100"""
markers = [
  "integration: live network tests against AFDB (run with: pytest -m integration)",
]

[tool.coverage.run]
source_pkgs = ["afdb_query"]
