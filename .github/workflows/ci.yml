name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # Unit suite only -- the `integration` marker is excluded by addopts, so CI
      # never depends on AFDB being reachable. Those tests exist to catch upstream
      # API drift and are meant to be run deliberately, not on every push.
      - name: Test
        run: pytest
